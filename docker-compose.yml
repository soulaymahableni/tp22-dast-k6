services:
  # Cible volontairement vulnérable (accès direct, sans durcissement)
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Reverse proxy Nginx durci devant Juice Shop
  proxy:
    image: nginx:stable-alpine
    container_name: proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - juice-shop
    restart: unless-stopped

  # contact-api (TP8) : cible du scan d'API OpenAPI (remplaçable par ta propre version)
  contact-api:
    build: ./contact-api
    container_name: contact-api
    ports:
      - "3002:3000"
    restart: unless-stopped
