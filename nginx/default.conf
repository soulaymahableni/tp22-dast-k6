# TP22 - Partie 3 : proxy Nginx durci devant Juice Shop
# Ce fichier est inclus dans le bloc http {} de nginx.conf.

# Ne plus afficher la version de Nginx (en-tête Server et pages d'erreur)
server_tokens off;

# WebSocket (socket.io de Juice Shop)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # --- 1. Retirer ce que l'application divulgue ou définit elle-même -----------------
    proxy_hide_header X-Powered-By;                 # divulgation de la techno (Express)
    proxy_hide_header Access-Control-Allow-Origin;  # CORS "*" trop permissif
    proxy_hide_header X-Frame-Options;              # remplacés par nos valeurs ci-dessous
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Feature-Policy;
    proxy_hide_header X-Recruiting;

    # --- 2. En-têtes de sécurité ("always" = aussi sur 404, 500, redirections) ---------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS : à activer seulement derrière HTTPS (sans effet en HTTP, et dangereux si mal configuré)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- 3. CSP --------------------------------------------------------------------------
    # a) Socle appliqué, qui ne casse rien (anti-clickjacking, plugins, <base>, formulaires)
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # b) Politique stricte en OBSERVATION : le navigateur signale les violations sans bloquer
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /csp-report" always;

    # Point de collecte des rapports CSP (ici simplement journalisés)
    location = /csp-report {
        access_log /var/log/nginx/csp-report.log;
        return 204;
    }

    location / {
        proxy_pass http://juice-shop:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Cookies posés par l'application : SameSite pour limiter le CSRF
        proxy_cookie_flags ~ samesite=lax;
    }
}
